name: Runtime Case Collector v0 Linux

on:
  workflow_dispatch:
    inputs:
      collect_candidates:
        description: Explicitly authorized receipt intake; default performs no private job
        type: boolean
        required: true
        default: false
      collector_output_route:
        description: Existing approved collector output directory
        type: string
        required: true
      receipt_path:
        description: Sanitized hoxline-collector-receipt-v1 envelope on trusted host
        type: string
        required: true
      evidence_path:
        description: Referenced sanitized evidence file matching the receipt digest
        type: string
        required: true
      execution_id:
        description: Exact HO-DET-001 execution correlation
        type: string
        required: true
  # Scheduled runs remain paused. No schedule is enabled by this workflow.

permissions:
  contents: read

concurrency:
  group: runtime-collector-linux
  cancel-in-progress: false

jobs:
  collect-linux-candidates:
    name: Collect Linux runtime candidates
    if: github.repository == 'HawkinsOperations/hawkinsoperations-platform' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.collect_candidates
    runs-on: [self-hosted, ho-gpu-01, gpu, v100]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - name: Check out platform repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up selected Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install explicit collector dependency
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Collect and verify this execution only
        env:
          COLLECTOR_LANE: linux
          SELECTED_SOURCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          lane = os.environ["COLLECTOR_LANE"]
          script = Path("scripts/ho_factory.py").resolve()
          def invoke(*arguments):
              try:
                  result = subprocess.run([sys.executable, "-B", str(script), *arguments, "--format", "json"],
                                          capture_output=True, text=True, timeout=120)
                  payload = json.loads(result.stdout) if result.returncode == 0 else None
              except (OSError, subprocess.SubprocessError, ValueError):
                  raise SystemExit("Collector stage failed; private details withheld") from None
              if result.returncode:
                  raise SystemExit("Collector stage failed; private details withheld")
              return payload
          # Read dispatch inputs from the event file: step env values are logged.
          try:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  inputs = json.load(event_file)["inputs"]
              route = inputs["collector_output_route"]
              execution = inputs["execution_id"]
              receipt_path = inputs["receipt_path"]
              evidence_path = inputs["evidence_path"]
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit("Collector inputs invalid; private details withheld") from None
          source = os.environ["SELECTED_SOURCE_REF"]
          invoke("collector-" + lane + "-preflight", "--output-route", route)
          result = invoke("collector-" + lane + "-run-once", "--collect", "--output-route", route,
                          "--receipt", receipt_path, "--evidence", evidence_path,
                          "--execution-id", execution, "--source-ref", source)
          candidate = str(Path(route) / result["output_name"])
          for action in ("verify", "dedupe-check"):
              invoke("collector-" + lane + "-" + action, "--candidate", candidate,
                     "--execution-id", execution, "--source-ref", source, "--packet-hash", result["packet_hash"])
          try:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("Receipt intake and current-output verification completed. "
                                "AI unavailable; human review required. No ledger append or proof promotion.\n")
          except OSError:
              raise SystemExit("Collector summary unavailable; private details withheld") from None
          PY
