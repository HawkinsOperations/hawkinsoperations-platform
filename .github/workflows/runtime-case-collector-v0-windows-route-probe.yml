name: Runtime Case Collector v0 Windows Route Probe

on:
  workflow_dispatch:
    inputs:
      collector_output_route:
        description: 'Private Windows collector output route to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-case-collector-v0-windows-route-probe
  cancel-in-progress: false

jobs:
  windows-route-probe:
    name: Windows collector private route probe
    if: github.repository == 'HawkinsOperations/hawkinsoperations-platform' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Confirm safe runner context
        shell: pwsh
        run: |
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "PROBE_TIME_UTC=$((Get-Date).ToUniversalTime().ToString('o'))"
          if ($env:RUNNER_OS -ne 'Windows') {
            Write-Output "WINDOWS_ROUTE_PROBE=fail_non_windows_runner"
            exit 1
          }

      - name: Probe private collector output route
        shell: pwsh
        env:
          COLLECTOR_OUTPUT_ROUTE: ${{ inputs.collector_output_route }}
        run: |
          $route = $env:COLLECTOR_OUTPUT_ROUTE
          if ([string]::IsNullOrWhiteSpace($route)) {
            Write-Output "WINDOWS_ROUTE_PROBE=fail_missing_route_input"
            exit 1
          }
          $allowed = @(
            'C:\Raylee\Data\runtime-case-collector-v0\windows',
            'C:\Raylee\Data\HawkinsOperations\runtime-case-collector-v0\windows'
          )
          if ($allowed -notcontains $route) {
            Write-Output "WINDOWS_ROUTE_PROBE=fail_route_not_allowlisted"
            exit 1
          }
          $routeExistsBefore = Test-Path -LiteralPath $route
          if (-not $routeExistsBefore) {
            Write-Output "WINDOWS_ROUTE_PROBE=fail_route_missing"
            exit 1
          }
          # Reject junctions/symlinks at every route component before writing.
          $routeComponent = Get-Item -LiteralPath $route -ErrorAction Stop
          if (-not $routeComponent.PSIsContainer) {
            Write-Output "WINDOWS_ROUTE_PROBE=fail_route_not_directory"
            exit 1
          }
          while ($null -ne $routeComponent) {
            if (($routeComponent.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              Write-Output "WINDOWS_ROUTE_PROBE=fail_route_redirected"
              exit 1
            }
            $routeComponent = $routeComponent.Parent
          }
          $probeName = "route-probe-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).txt"
          $probePath = Join-Path -Path $route -ChildPath $probeName
          $probeBody = @(
            'WINDOWS_ROUTE_PROBE=pass',
            "RUN_ID=$env:GITHUB_RUN_ID",
            "RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT",
            "PROBE_TIME_UTC=$((Get-Date).ToUniversalTime().ToString('o'))"
          )
          # Exclusive creation refuses existing files, including redirected targets.
          $probeStream = [System.IO.File]::Open($probePath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try {
            $probeBytes = [System.Text.UTF8Encoding]::new($false).GetBytes(($probeBody -join "`n") + "`n")
            $probeStream.Write($probeBytes, 0, $probeBytes.Length)
          } finally {
            $probeStream.Dispose()
          }
          $writeSucceeded = Test-Path -LiteralPath $probePath
          Write-Output "ROUTE_EXISTS_BEFORE=$routeExistsBefore"
          Write-Output "ROUTE_EXISTS_AFTER=$(Test-Path -LiteralPath $route)"
          Write-Output "WRITE_SUCCEEDED=$writeSucceeded"
          if (-not $writeSucceeded) {
            Write-Output "WINDOWS_ROUTE_PROBE=fail_write"
            exit 1
          }
          Write-Output "WINDOWS_ROUTE_PROBE=pass"

      - name: Confirm no collector or ledger mutation
        shell: pwsh
        run: |
          Write-Output "RUNTIME_CASE_COLLECTOR_BUILT=false"
          Write-Output "LIFETIME_CASE_LEDGER_MUTATED=false"
          Write-Output "GOVERNED_CASES_APPENDED=false"
          Write-Output "PUBLIC_SAFE_PROMOTION=false"
